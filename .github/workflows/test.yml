name: Test

on:
  push:

permissions:
  contents: read

jobs:
  stripper:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'
      - name: Run stripper unit tests
        run: python test_strip_unused_markup.py
