name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - 'main'
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-workers
  cancel-in-progress: true

jobs:
  build:
    # The 0.0.0 tag is not deployed, so it should not spend build minutes.
    if: ${{ !(github.ref_type == 'tag' && github.ref_name == '0.0.0') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Keep building the other languages when one fails, so every error shows
      # up in a single run.
      fail-fast: false
      matrix:
        language: [en, ja, ko, zh-cn, zh-tw]
    env:
      LANGUAGE: ${{ matrix.language }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Set version
        run: |
          echo "${GITHUB_REF_NAME}" > version
      - name: Build pages
        run: sh ./buildLanguage.sh "$LANGUAGE" servedhtml
      # Stage under the language name so the artifacts unpack as _build/<lang>.
      # .doctrees is Sphinx working state that nothing downstream reads.
      - name: Stage build output
        run: |
          mkdir -p artifact
          rsync -a --exclude=.doctrees "_build/${LANGUAGE}/" "artifact/${LANGUAGE}/"
      - uses: actions/upload-artifact@v6
        with:
          name: served-${{ matrix.language }}
          path: artifact
          include-hidden-files: true

  deploy:
    needs: build
    if: ${{ !(github.ref_type == 'tag' && github.ref_name == '0.0.0') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'
      - name: Test helper scripts
        run: |
          python test_strip_unused_markup.py
          python test_help_urls.py
      - uses: actions/download-artifact@v6
        with:
          pattern: served-*
          merge-multiple: true
          path: _build
      - name: Get minify
        run: wget -qO- https://github.com/tdewolff/minify/releases/download/v2.24.17/minify_linux_amd64.tar.gz | tar -xz
      - name: Minify files
        run: ./minify -v -r --sync -o . _build --exclude "_build/*/_static/js/petite-vue.js"
      - name: Create archive directory
        run: mv _build help_pages
      - name: Check served URLs
        run: python check_served_urls.py help_pages
      - name: Add to build folder
        run: cp -r _add_to_build/* help_pages
      - name: Remove Sphinx working state
        run: find help_pages -type d -name .doctrees -prune -exec rm -rf {} +
      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.164.0'
          command: deploy
      - name: Show deployment URL
        run: echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}"
