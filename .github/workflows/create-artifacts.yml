name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Keep building the other languages when one fails, so every error shows
      # up in a single run.
      fail-fast: false
      matrix:
        language: [en, ja, ko, zh-cn, zh-tw]
    env:
      LANGUAGE: ${{ matrix.language }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Set version
        run: |
          echo "${GITHUB_REF_NAME}" > version
      - name: Build pages
        run: sh ./buildLanguage.sh "$LANGUAGE"
      # Stage under the language name so the artifacts unpack as _build/<lang>.
      # .doctrees is Sphinx working state that nothing downstream reads.
      - name: Stage build output
        run: |
          mkdir -p artifact
          rsync -a --exclude=.doctrees "_build/${LANGUAGE}/" "artifact/${LANGUAGE}/"
      - uses: actions/upload-artifact@v6
        with:
          name: site-${{ matrix.language }}
          path: artifact
          # .buildinfo is hidden and has to stay in the local Help archives.
          include-hidden-files: true

  assemble:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'
          cache: pip
      # test_git_dates.py imports sphinx.util.matching.
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test helper scripts
        run: |
          python test_strip_unused_markup.py
          python test_git_dates.py
      - uses: actions/download-artifact@v6
        with:
          pattern: site-*
          merge-multiple: true
          path: _build
      - name: Get minify
        run: wget -qO- https://github.com/tdewolff/minify/releases/download/v2.24.17/minify_linux_amd64.tar.gz | tar -xz
      - name: Minify files
        run: ./minify -v -r --sync -o . _build --exclude "_build/*/_static/js/petite-vue.js"
      - name: Make copy for local help
        run: cp -r _build Help/
      - uses: actions/setup-go@v6
        with:
          go-version: '^1.27'
          cache-dependency-path: unneeded-html-remover/go.sum
      - name: unneeded-html-remover
        run: go run . ../Help
        working-directory: unneeded-html-remover
      - name: Minify local files
        run: ./minify -v -r --sync -o . Help --exclude "Help/*/_static/js/petite-vue.js"
      - run: ls Help
      - name: Create language archives
        run: |
          languages=('en' 'ja' 'ko' 'zh-cn' 'zh-tw')
          for language in "${languages[@]}"
          do
            zip -r "${language}.zip" "Help/${language}" -x **/sitemap.xml **/.doctrees/** **/objects.inv
          done
      - name: Create archive
        run: |
          zip -r archive.zip Help \
            -x Help/404.html Help\en\404.html Help/index.html **/sitemap.xml **/.doctrees/** **/objects.inv
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: artifact
          path: archive.zip
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: 'automation-test/package-lock.json'
      - name: Test
        run: |
          npm ci
          npm start
        working-directory: automation-test
      - name: Publish asset
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v1
        with:
          files: archive.zip
      - name: Publish English
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v1
        with:
          files: en.zip
      - name: Publish Japanese
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v1
        with:
          files: ja.zip
      - name: Publish Korean
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v1
        with:
          files: ko.zip
      - name: Publish Chinese Simplified
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v1
        with:
          files: zh-cn.zip
      - name: Publish Chinese Traditional
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v1
        with:
          files: zh-tw.zip
