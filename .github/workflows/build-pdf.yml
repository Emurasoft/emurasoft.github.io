name: Build PDFs

on:
  push:
    branches:
      - 'main'
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-pdfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buildPDF:
    name: Build PDF (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix:
        # A main push builds English only, as a smoke test for LaTeX errors.
        # Tags and manual runs build both languages; only tags publish.
        language: ${{ (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') && fromJSON('["en","ja"]') || fromJSON('["en"]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'
          cache: pip
      # Ubuntu's texlive packages are frozen at TeX Live 2023, whose luaotfload
      # and fontspec are older than the versions the PDFs were verified with.
      # Install a current TeX Live instead; the action caches ~/texlive.
      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          texlive_version: 2025
          packages: >
            scheme-basic
            latexmk
            collection-latexrecommended
            collection-latexextra
            collection-fontsrecommended
            collection-luatex
            collection-langjapanese
            collection-xetex
      - name: Install python dependencies
        run: pip install -r requirements.txt
      - name: Set version
        run: |
          echo "${GITHUB_REF_NAME}" > version
      - name: Create PDF
        run: python buildPDF.py ${{ matrix.language }}
      - name: Upload PDF
        uses: actions/upload-artifact@v6
        with:
          name: emeditor-pdf-${{ matrix.language }}
          path: _build/emeditor-${{ matrix.language }}.pdf

  publish:
    name: Publish PDFs
    needs: buildPDF
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download PDFs
        uses: actions/download-artifact@v6
        with:
          pattern: emeditor-pdf-*
          merge-multiple: true
          path: _build
      - name: Publish PDFs
        uses: softprops/action-gh-release@v1
        with:
          files: |
            _build/emeditor-en.pdf
            _build/emeditor-ja.pdf
          fail_on_unmatched_files: true
